<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – Yoel Estomihi Sinaga</title>
</head>
<body>
    <header>
        <h1>CONTACT ME</h1>
        <nav aria-label="Navigasi utama">
            <a href="index.html">Home</a> |
            <a href="portfolio.html">Portfolio</a> |
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Kontak</h2>
            <p>Email: <a href="mailto:yoelsinaga179@gmail.com">yoelsinaga179@gmail.com</a></p>
            <p>Instagram: <a href="https://www.instagram.com/yoel.sinagaa" target="_blank" rel="noopener">@yoel.sinagaa</a></p>
        </section>

        <section>
            <h2>Kirim Pesan</h2>
            <form action="#" method="post">
                <p>
                    <label for="nama">Nama</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>

                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="subjek">Subjek</label><br>
                    <input type="text" id="subjek" name="subjek">
                </p>

                <p>
                    <label for="kebutuhan">Jenis Kebutuhan</label><br>
                    <select id="kebutuhan" name="kebutuhan">
                        <option value="collaboration">Collaboration</option>
                        <option value="freelance">Freelance</option>
                        <option value="other">Other</option>
                    </select>
                </p>

                <p>
                    <label for="pesan">Pesan</label><br>
                    <textarea id="pesan" name="pesan" rows="6" cols="40"></textarea>
                </p>

                <p>
                    <input type="checkbox" id="persetujuan" name="persetujuan" required>
                    <label for="persetujuan">Saya menyetujui pengiriman data pada form ini untuk kebutuhan kontak.</label>
                </p>

                <button type="submit">Kirim Pesan</button>
            </form>
        </section>
    </main>

    <footer>
        <p>My Personal Website – 2026 | Yoel Estomihi Sinaga</p>
    </footer>
</body>
</html>
